<!-- TimerPlus search results popup -->
<html>
  <head>
    <title>TimerPlus Search Results</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <style>
      body { font-family: Arial, sans-serif; font-size: 12px; margin: 8px; }
      h2 { color: #2c3e50; margin-bottom: 10px; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
      table { border-collapse: collapse; width: 100%; background-color: #f9f9f9; }
      td, th { border: 1px solid #bdc3c7; padding: 8px; }
      th { background-color: #34495e; color: white; text-align: center; font-weight: bold; }
      th:first-child { text-align: left; }
      tr:nth-child(even) td { background-color: #ffffff; }
      tr:hover td { background-color: #e8f4f8; }
    </style>
  </head>
  <body>
    <h2>TimerPlus Search Results</h2>
    <table>
      <tr>
        <th>Molecule Name</th>
        <th>Work Time</th>
        <th>Refine Time</th>
        <th>Idle Time</th>
        <th>Wave Function</th>
        <th>Last Updated</th>
        <th>Edit</th>
      </tr>
      $spy.TimerPlus.get_filtered_history_popup()
    </table>
  </body>
</html>
